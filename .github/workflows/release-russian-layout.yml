name: Release Russian Localization

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: xai-grok-pager.exe
            archive: grok-build-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Configure Cargo Flags
        shell: bash
        run: |
          echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
          echo "CARGO_NET_RETRY=10" >> $GITHUB_ENV

      - name: Install DotSlash
        uses: actions/cache@v4
        id: dotslash-cache
        with:
          path: ~/.cargo/bin/dotslash*
          key: dotslash-${{ runner.os }}

      - name: Install DotSlash binary
        if: steps.dotslash-cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install dotslash --locked

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'protoc-29.3'
          $zip = Join-Path $env:RUNNER_TEMP 'protoc-29.3-win64.zip'
          $url = 'https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip'

          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $root -Force

          $bin = Join-Path $root 'bin'
          $realProtoc = Join-Path $bin 'protoc-real.exe'
          $wrapper = Join-Path $bin 'protoc-wrapper.exe'
          Copy-Item (Join-Path $bin 'protoc.exe') $realProtoc -Force

          $source = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/protoc-wrapper.rs'
          rustc $source -O -o $wrapper

          & $realProtoc --version
          & $wrapper --version
          "PROTOC=$wrapper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release binary
        shell: bash
        run: cargo build -p xai-grok-pager-bin --release --features release-dist --target ${{ matrix.target }}

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.exe }}" dist/
          Compress-Archive -Path dist/${{ matrix.exe }} -DestinationPath "${{ matrix.archive }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.6-ru-full"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" release-assets/* \
            --title "Grok Build 1.0.6 — Полная русская локализация и фикс раскладки" \
            --notes "Включает полную русскую локализацию интерфейса, статусов выполнения, инструментов и фикс горячих клавиш вставки (Ctrl+V / Ctrl+Shift+V) на русской раскладке в Windows.\n\nBuild commit: $GITHUB_SHA" \
            --target "$GITHUB_SHA"
